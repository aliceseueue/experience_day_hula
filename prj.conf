CONFIG_SERIAL=y
CONFIG_GPIO=y
CONFIG_MAIN_STACK_SIZE=2048

# USB CDC ACM is the protocol transport. The board dts already enables the
# SoC's USB device controller (zephyr_udc0) with the PA11/PA12 pinctrl this
# board uses; app.overlay adds the cdc_acm_uart0 node the class driver binds
# to. This brings the device up and enables it at boot, which is all this
# single-interface device needs.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# Identify as a vendor device. The Zephyr sample VID must not ship.
CONFIG_CDC_ACM_SERIAL_VID=0x2FE3
CONFIG_CDC_ACM_SERIAL_PID=0x1050
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="rf-atten"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="rf-atten"
CONFIG_CDC_ACM_SERIAL_SELF_POWERED=y

# No console on this link. Any printk from a subsystem, assert, or fault
# handler would interleave with protocol replies and desync the host client.
#
# CONFIG_UART_CONSOLE must be off explicitly: the board defconfig sets it, and
# the board's chosen zephyr,console node is &usart2, which app.overlay disables.
# Leaving the console on while its chosen node is disabled fails the build in
# uart_console.c with an undefined __device_dts_ord_*.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_SHELL=n